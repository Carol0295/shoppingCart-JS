<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Shopping-Cart Project</title>
        <link rel="stylesheet" href="/assets/css/style.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    </head>
    <body>
        <header>
            <h1><i class="fas fa-shopping-cart"></i> Shopping-cart</h1>
        </header>
        <main class="page-layout">

          <section class="products" id="product-catalog">
          </section>
  
          <section class="cart">
            <h2><i class="fas fa-shopping-cart"></i> Cart</h2>
            <!-- Here show the list of selected products -->
            <div id="cart-content">
                <p id="no-products-msg">There are no products in the cart.</p>
            </div>
            <div id="cart-summary" class="hidden">
              <p id="cart-total">Price (with Tax): 0,00 €</p>
              <button id="pay-btn">Pay</button>
            </div>
            
          </section>  
        </main>
        
        <script src="./assets/js/catalog.js" defer></script>
        <script src="./assets/js/cart.js" defer></script>
        <script src="./assets/js/utils.js" defer></script>
        <script src="./assets/js/main.js" defer></script>
        
    </body>
</html>
